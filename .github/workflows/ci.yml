name: Django CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django

      # Run Django migrations
      - name: Apply migrations
        run: |
          source venv/bin/activate
          python manage.py migrate --settings=settings_test

      # Run tests with coverage
      - name: Run unit tests
        run: |
          # skip integration tests
          source venv/bin/activate
          pytest --ds=settings_test --cov=stats --cov-report=term -m "not integration" --tb=short -q
  integration-tests:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[integration]')

    needs: unit-tests

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      # Run Django migrations
      - name: Apply migrations
        run: |
          source venv/bin/activate
          python manage.py migrate --settings=test_settings

      # Run tests
      - name: Run integration tests
        run: |
          source venv/bin/activate
          pytest --ds=test_settings -m integration --tb=short -q
